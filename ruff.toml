target-version = "py39"
line-length = 120

[lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear
select = ["E", "F", "W", "I", "UP", "B"]
# Keep typing.Optional: X | None needs Python 3.10 at runtime (get_type_hints).
ignore = ["UP045", "UP007"]
